server {
    listen 80;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/events {
        set $calendar_upstream http://calendar-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $calendar_upstream;
        proxy_set_header Host $host;
    }

    location /api/outbox {
        set $calendar_upstream http://calendar-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $calendar_upstream;
        proxy_set_header Host $host;
    }

    location /api/saga {
        set $calendar_upstream http://calendar-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $calendar_upstream;
        proxy_set_header Host $host;
    }

    location /api/users {
        set $user_upstream http://user-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $user_upstream;
        proxy_set_header Host $host;
    }

    location /api/nlp/ {
        set $nlp_upstream http://nlp-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $nlp_upstream;
        proxy_set_header Host $host;
    }

    location /api/notifications {
        set $notif_upstream http://notification-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $notif_upstream;
        proxy_set_header Host $host;
    }

    location /api/inbox {
        set $notif_upstream http://notification-service:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $notif_upstream;
        proxy_set_header Host $host;
    }

    location /mcp {
        set $mcp_upstream http://mcp-server:8090;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /health {
        return 200 '{"status": "gateway_ok", "lab": 4}';
        add_header Content-Type application/json;
    }
}
