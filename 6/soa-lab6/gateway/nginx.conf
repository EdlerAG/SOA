events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    log_format json_trace escape=json
      '{"ts":"$time_iso8601","service":"api-gateway","trace_id":"$request_id",'
      '"method":"$request_method","uri":"$request_uri","status":$status,"duration":$request_time}';

    access_log /dev/stdout json_trace;

    server {
        listen 80;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        location /api/users {
            set $upstream_user user-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_user:8000;
            proxy_set_header X-Trace-ID $request_id;
        }

        location /api/nlp {
            set $upstream_nlp nlp-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_nlp:8000;
            proxy_set_header X-Trace-ID $request_id;
        }

        location /api/events {
            set $upstream_calendar calendar-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_calendar:8000;
            proxy_set_header X-Trace-ID $request_id;
        }

        location /api/incidents {
            set $upstream_calendar calendar-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_calendar:8000;
            proxy_set_header X-Trace-ID $request_id;
        }

        location /api/notifications {
            set $upstream_notif notification-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_notif:8000;
            proxy_set_header X-Trace-ID $request_id;
        }
    }
}
