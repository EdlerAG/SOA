events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location = / {
            root /usr/share/nginx/html;
            try_files /demo_auth.html =404;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        location /api/users {
            set $upstream_user user-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_user:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
        }

        location /api/nlp {
            set $upstream_nlp nlp-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_nlp:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
        }

        location /api/events {
            set $upstream_calendar calendar-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_calendar:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
        }

        location /api/notifications {
            set $upstream_notif notification-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream_notif:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
        }
    }
}
